name = "gitzw"
main = "src/index.js"
compatibility_date = "2024-12-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "gitzw-db"
database_id = ""

# 环境变量
[vars]
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "admin123456"
JWT_SECRET = "change-this-to-a-random-secret"
RESEND_API_KEY = ""
OPENAI_API_KEY = ""
SITE_URL = "https://gitzw.pages.dev"

# Cron 定时任务（每小时抓取 GitHub Trending）
[triggers]
crons = ["0 * * * *"]
