name = "gitzw"
main = "src/index.js"
compatibility_date = "2024-12-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "gitzw-db"
database_id = ""

# D1 数据库迁移
[[migrations]]
tag = "v1"
new_directory = "migrations/001_create_tables.sql"

[[migrations]]
tag = "v2"
new_directory = "migrations/002_add_indexes.sql"

[[migrations]]
tag = "v3"
new_directory = "migrations/003_create_fetch_logs.sql"

# ========== 环境变量 ==========
# 🔴 重要：部署前必须设置以下环境变量
# 通过 `npx wrangler secret put JWT_SECRET` 设置生产密钥
# 通过 Cloudflare Dashboard → Workers → gitzw → Settings → Variables 设置

[vars]
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "admin123456"
JWT_SECRET = "change-this-to-a-random-secret"
RESEND_API_KEY = ""
OPENAI_API_KEY = ""
SITE_URL = "https://gitzw.pages.dev"

# Cron 定时任务（每 3 小时抓取 GitHub Trending）
[triggers]
crons = ["0 */3 * * *"]
